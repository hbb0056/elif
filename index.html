<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Minik Kâşif - Sayı Balonları</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Safari'de kaydırmayı ve zoom'u engellemek için touch-action: none */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #29B6F6; touch-action: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; touch-action: none; }
  #canvas-container { position: absolute; inset: 0; z-index: 1; touch-action: none; }
  
  .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
  
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
  .back-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #FF5252; color: #fff; font-size: 24px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #D32F2F; }
  .back-btn:active { transform: translateY(4px); box-shadow: none; }
  .title { font-size: 22px; font-weight: 900; color: #333; }
  
  .speech-bubble { position: absolute; top: 90px; right: 20px; background: #FFD54F; padding: 14px 30px; border-radius: 20px; font-size: 44px; font-weight: 900; color: #D84315; box-shadow: 0 8px 0 #FFA000; border: 4px solid #fff; animation: float 2s ease-in-out infinite; pointer-events: auto; text-align: center; line-height: 1; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  
  .food-container { display: flex; justify-content: center; gap: 20px; padding: 26px; pointer-events: auto; flex-wrap: wrap; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top-left-radius: 40px; border-top-right-radius: 40px; box-shadow: 0 -10px 20px rgba(0,0,0,0.1); }
  .food-item { width: 100px; height: 100px; border-radius: 50%; background: #FFF59D; border: 6px solid #fff; font-size: 36px; font-weight: 900; color: #5D4037; cursor: pointer; box-shadow: 0 8px 0 #FBC02D; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .1s; padding: 0; }
  .food-item:active { transform: translateY(6px); box-shadow: 0 2px 0 #FBC02D; }
  .food-item.wrong { background: #EF9A9A; border-color: #E57373; box-shadow: 0 8px 0 #C62828; animation: shake .4s; }
  .food-item.correct { background: #A5D6A7; border-color: #81C784; box-shadow: 0 8px 0 #2E7D32; animation: pop .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  
  #loading { position: absolute; inset: 0; background: #29B6F6; z-index: 100; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #fff; flex-direction: column; gap: 16px; transition: opacity 0.5s; }
  .spinner { font-size: 60px; animation: spin 2s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner">🐾</div>
  <div id="loadingText">Dünya Yükleniyor...</div>
</div>

<div id="app">
  <div id="canvas-container"></div>
  <div class="ui-layer">
    <div class="header">
      <button class="back-btn" onclick="location.reload()">←</button>
      <div class="title">Kediyi Besle</div>
      <div style="width: 50px;"></div>
    </div>
    <div class="speech-bubble" id="petBubble">?</div>
    <div class="food-container" id="foodContainer"></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/loaders/DRACOLoader.js"></script>

<script>
/* ==================== iOS SES İZNİ VE UYANDIRMA ==================== */
let audioCtx = null;
let isAudioUnlocked = false;

function unlockAudio() {
  if (isAudioUnlocked) return;
  
  // 1. Audio Context'i başlat (iOS için)
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // 2. SpeechSynthesis'i sessiz bir kelimeyle uyandır (iOS için)
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }
  
  isAudioUnlocked = true;
}

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/* ==================== SESLER ==================== */
function playPop() {
  const ctx = getAudioCtx(); const now = ctx.currentTime;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
  gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
  osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.1);
}
function playBuzz() {
  const ctx = getAudioCtx(); const now = ctx.currentTime;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(300, now + 0.2);
  gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
  osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.2);
}
function playCry() {
  const ctx = getAudioCtx(); const now = ctx.currentTime; const dur = 1.5;
  const osc1 = ctx.createOscillator(); const osc2 = ctx.createOscillator(); const gain = ctx.createGain();
  osc1.type = 'sawtooth'; osc2.type = 'sine';
  osc1.frequency.setValueAtTime(380, now); osc1.frequency.exponentialRampToValueAtTime(620, now + dur * 0.3); osc1.frequency.exponentialRampToValueAtTime(340, now + dur * 0.6); osc1.frequency.exponentialRampToValueAtTime(620, now + dur * 0.85); osc1.frequency.exponentialRampToValueAtTime(340, now + dur);
  osc2.frequency.setValueAtTime(760, now); osc2.frequency.exponentialRampToValueAtTime(1180, now + dur * 0.3); osc2.frequency.exponentialRampToValueAtTime(700, now + dur * 0.6); osc2.frequency.exponentialRampToValueAtTime(1100, now + dur * 0.85); osc2.frequency.exponentialRampToValueAtTime(680, now + dur);
  gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.12, now + 0.15); gain.gain.linearRampToValueAtTime(0.12, now + dur - 0.3); gain.gain.linearRampToValueAtTime(0, now + dur);
  osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
  osc1.start(now); osc2.start(now); osc1.stop(now + dur); osc2.stop(now + dur);
}
function playDing() {
  const ctx = getAudioCtx(); const now = ctx.currentTime;
  [523.25, 659.25, 783.99].forEach((freq, i) => {
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    const t = now + i * 0.09;
    gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.18, t + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t + 0.7);
  });
}

/* ==================== TTS (Konuşma) ==================== */
let trVoice = null;
function loadVoices() { 
  if('speechSynthesis' in window) {
    const v = speechSynthesis.getVoices(); 
    trVoice = v.find(x => x.lang.startsWith('tr')) || null; 
  }
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function say(text) {
  if (!isAudioUnlocked || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'tr-TR'; if (trVoice) u.voice = trVoice; u.rate = 0.9; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

/* ==================== 3D SAHNE ==================== */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x29B6F6);
scene.fog = new THREE.Fog(0x29B6F6, 15, 40);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 5);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // iPhone Retina ekranlar için performans ayarı
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2); // Gölge yumuşatıldı
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true; 
dirLight.shadow.mapSize.width = 512; // iPhone performansı için düşürüldü
dirLight.shadow.mapSize.height = 512;
dirLight.shadow.camera.left = -5;
dirLight.shadow.camera.right = 5;
dirLight.shadow.camera.top = 5;
dirLight.shadow.camera.bottom = -5;
scene.add(dirLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x66BB6A, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function createTree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2, 6), new THREE.MeshStandardMaterial({ color: 0x795548 }));
  trunk.position.y = 1; trunk.castShadow = true; g.add(trunk);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2E7D32, flatShading: true });
  const l1 = new THREE.Mesh(new THREE.ConeGeometry(1.2, 1.5, 6), leafMat); l1.position.y = 2.2; l1.castShadow = true; g.add(l1);
  const l2 = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.2, 6), leafMat); l2.position.y = 3.0; l2.castShadow = true; g.add(l2);
  g.position.set(x, 0, z); g.scale.set(s, s, s); scene.add(g);
}
createTree(-5, -8, 1.2); createTree(6, -10, 1.5); createTree(-8, -5, 1.0);

/* ==================== DOKULAR ==================== */
function createEmojiTexture(emoji) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = '96px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function createNumberTexture(num) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.beginPath();
  ctx.arc(128, 128, 110, 0, Math.PI * 2);
  ctx.fillStyle = '#FFD54F'; 
  ctx.fill();
  ctx.lineWidth = 12;
  ctx.strokeStyle = '#FF8F00';
  ctx.stroke();
  ctx.font = 'bold 140px Arial';
  ctx.fillStyle = '#D84315'; 
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num.toString(), 128, 138); 
  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

/* ==================== CANLILAR ==================== */
const clickableObjects = [];
const numberBalloons = [];
const fallingNumbers = [];
const bugs = [];

function spawnBubble() {
  const group = new THREE.Group();
  
  // iPhone performansı için MeshPhysicalMaterial yerine MeshStandardMaterial kullanıldı
  const bubbleMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.1
  });
  const bubble = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 12), bubbleMat);
  group.add(bubble);

  const num = Math.floor(Math.random() * 10) + 1;
  const numMat = new THREE.SpriteMaterial({ map: createNumberTexture(num) });
  const numSprite = new THREE.Sprite(numMat);
  numSprite.scale.set(0.8, 0.8, 1);
  group.add(numSprite);

  group.position.set((Math.random() - 0.5) * 8, -2, (Math.random() - 0.5) * 4 - 1);
  group.userData = { isBubble: true, num: num, speed: 0.02 + Math.random() * 0.02, timeOffset: Math.random() * 10 };
  
  scene.add(group);
  numberBalloons.push(group);
  clickableObjects.push(bubble);
  bubble.userData.parentGroup = group;
}

function spawnBug() {
  const isBee = Math.random() > 0.5;
  const emoji = isBee ? '🐝' : '🦋';
  
  const bugMat = new THREE.SpriteMaterial({ map: createEmojiTexture(emoji) });
  const bug = new THREE.Sprite(bugMat);
  
  bug.scale.set(0.6, 0.6, 1);
  bug.position.set((Math.random() - 0.5) * 6, 1 + Math.random() * 2, (Math.random() - 0.5) * 4 - 1);
  
  bug.userData = { 
    isBug: true, baseX: bug.position.x, baseY: bug.position.y, baseZ: bug.position.z, 
    speed: 1 + Math.random() * 2, radius: 1 + Math.random() * 2, isFleeing: false, fleeTimer: 0
  };
  
  scene.add(bug);
  bugs.push(bug);
  clickableObjects.push(bug);
}

for(let i=0; i<4; i++) spawnBubble();
for(let i=0; i<3; i++) spawnBug();

/* ==================== KEDİ MODELİ ==================== */
const loader = new THREE.GLTFLoader();
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
loader.setDRACOLoader(dracoLoader);

const modelUrl = 'https://files.catbox.moe/ta925o.glb'; 

const petGroup = new THREE.Group();
scene.add(petGroup);

let isHappy = false;
let isSad = false;
let modelLoaded = false;
let bones = { tail: null, earL: null, earR: null };

loader.load(modelUrl, (gltf) => {
    modelLoaded = true;
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
    
    const petModel = gltf.scene;
    petModel.traverse(node => {
      if (node.isMesh) {
        node.castShadow = true; node.receiveShadow = true;
        if (node.material && node.material.map) node.material.map.encoding = THREE.sRGBEncoding;
      }
      const name = node.name.toLowerCase();
      if (name.includes('tail') && !bones.tail) bones.tail = node;
      if (name.includes('ear') && name.includes('l') && !bones.earL) bones.earL = node;
      if (name.includes('ear') && name.includes('r') && !bones.earR) bones.earR = node;
    });

    const box = new THREE.Box3().setFromObject(petModel);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 1.8 / maxDim;
    
    petModel.scale.set(scale, scale, scale);
    petModel.position.x = -center.x * scale;
    petModel.position.z = -center.z * scale;
    petModel.position.y = -box.min.y * scale;
    
    petGroup.add(petModel);
    startGame();
  },
  undefined,
  (err) => { document.getElementById('loadingText').innerHTML = 'Model Yüklenemedi.'; }
);

/* ==================== DOKUNMA ALGILAMA (iOS UYUMLU) ==================== */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function handleInteraction(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(clickableObjects, true);

  if (intersects.length > 0) {
    const hit = intersects[0].object;
    
    if (hit.userData.isBubble) {
      const bubbleGroup = hit.userData.parentGroup;
      const num = bubbleGroup.userData.num;
      
      playPop();
      setTimeout(() => say(numberNames[num]), 150);

      bubbleGroup.visible = false;
      clickableObjects.splice(clickableObjects.indexOf(hit), 1);
      
      const numSprite = bubbleGroup.children[1];
      numSprite.position.copy(bubbleGroup.position);
      scene.add(numSprite);
      
      fallingNumbers.push({ mesh: numSprite, velY: 0 });
      scene.remove(bubbleGroup);
      
      setTimeout(spawnBubble, 1500);
    }
    
    if (hit.userData.isBug) {
      if (!hit.userData.isFleeing) {
        playBuzz();
        hit.userData.isFleeing = true;
        hit.userData.fleeTimer = 0;
        hit.userData.fleeStartX = hit.position.x;
        hit.userData.fleeStartY = hit.position.y;
      }
    }
  }
}

// Safari ve iOS için hem touchstart hem pointerdown dinliyoruz
container.addEventListener('touchstart', (e) => {
  e.preventDefault(); // Zoom/scroll engelle
  unlockAudio();
  if (e.touches.length > 0) {
    handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

container.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse') {
    unlockAudio();
    handleInteraction(e.clientX, e.clientY);
  }
});

/* ==================== OYUN MANTIĞI ==================== */
const numberNames = {1:'bir',2:'iki',3:'üç',4:'dört',5:'beş',6:'altı',7:'yedi',8:'sekiz',9:'dokuz',10:'on'};
let game = { target: null, locked: true, active: false };

function startGame() {
  game.active = true;
  say('Miyav! Beni beslemeye hazır mısın?');
  newRound();
}

function newRound() {
  game.locked = false;
  isHappy = false;
  isSad = false;
  petGroup.position.y = 0;

  const target = Math.floor(Math.random() * 10) + 1;
  game.target = target;
  document.getElementById('petBubble').textContent = target;

  const fc = document.getElementById('foodContainer');
  fc.innerHTML = '';

  let choices = [target];
  while (choices.length < 3) {
    const r = Math.floor(Math.random() * 10) + 1;
    if (!choices.includes(r)) choices.push(r);
  }
  choices.sort(() => Math.random() - 0.5);

  choices.forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'food-item';
    btn.innerHTML = `<span style="font-size:22px">🐟</span><span>${num}</span>`;
    btn.onclick = () => checkAnswer(num, btn);
    fc.appendChild(btn);
  });

  setTimeout(() => say(`Miyav! Ben ${numberNames[target]} istiyorum`), 600);
}

function checkAnswer(selected, btn) {
  if (game.locked) return;
  game.locked = true;

  if (selected === game.target) {
    btn.classList.add('correct');
    playDing();
    document.getElementById('petBubble').textContent = '😋';
    isHappy = true;
    setTimeout(() => say('Miyav! Aferin! Mmm yum yum'), 400);
    setTimeout(() => { isHappy = false; newRound(); }, 2500);
  } else {
    btn.classList.add('wrong');
    document.getElementById('petBubble').textContent = '😢';
    isSad = true;
    playCry();
    setTimeout(() => say('Miyaavv... ühü ühü'), 100);
    setTimeout(() => {
      btn.classList.remove('wrong');
      isSad = false;
      document.getElementById('petBubble').textContent = game.target;
      game.locked = false;
    }, 2000);
  }
}

/* ==================== ANİMASYON DÖNGÜSÜ ==================== */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  const delta = clock.getDelta();

  if (modelLoaded) {
    if (isHappy) {
      petGroup.position.y = Math.abs(Math.sin(time * 10)) * 0.4;
      petGroup.rotation.y += 0.1; 
    } else if (isSad) {
      petGroup.rotation.z = Math.sin(time * 40) * 0.08;
    } else {
      petGroup.position.y = Math.sin(time * 2) * 0.03;
      petGroup.rotation.z = 0;
      petGroup.rotation.y += 0.005;
    }
    if (bones.tail) bones.tail.rotation.y = Math.sin(time * 3) * 0.5;
    if (bones.earL && bones.earR) {
      const twitch = Math.sin(time * 10) > 0.9 ? 0.2 : 0;
      bones.earL.rotation.z = twitch;
      bones.earR.rotation.z = -twitch;
    }
  }

  for (let i = 0; i < numberBalloons.length; i++) {
    const b = numberBalloons[i];
    b.position.y += b.userData.speed;
    b.position.x += Math.sin(time + b.userData.timeOffset) * 0.005;
    
    if (b.position.y > 8) {
      b.position.y = -2;
      b.position.x = (Math.random() - 0.5) * 8;
      b.userData.num = Math.floor(Math.random() * 10) + 1;
      b.children[1].material.map = createNumberTexture(b.userData.num);
    }
  }

  for (let i = fallingNumbers.length - 1; i >= 0; i--) {
    const f = fallingNumbers[i];
    f.velY -= 0.015;
    f.mesh.position.y += f.velY;
    f.mesh.rotation.z += 0.1;
    
    if (f.mesh.position.y < 0.2) {
      scene.remove(f.mesh);
      fallingNumbers.splice(i, 1);
    }
  }

  for (let i = 0; i < bugs.length; i++) {
    const b = bugs[i];
    
    if (b.userData.isFleeing) {
      b.userData.fleeTimer += delta;
      b.position.y += 0.1;
      b.position.x += (b.position.x - b.userData.fleeStartX) * 0.05;
      b.position.z -= 0.1;
      b.scale.set(Math.max(0, 0.6 - b.userData.fleeTimer), Math.max(0, 0.6 - b.userData.fleeTimer), 1);
      
      if (b.userData.fleeTimer > 0.8) {
        scene.remove(b);
        bugs.splice(i, 1);
        clickableObjects.splice(clickableObjects.indexOf(b), 1);
        setTimeout(spawnBug, Math.random() * 3000);
        i--;
      }
    } else {
      b.position.x = b.userData.baseX + Math.cos(time * b.userData.speed) * b.userData.radius;
      b.position.y = b.userData.baseY + Math.sin(time * b.userData.speed * 1.5) * 0.5;
      b.position.z = b.userData.baseZ + Math.sin(time * b.userData.speed) * b.userData.radius;
    }
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
